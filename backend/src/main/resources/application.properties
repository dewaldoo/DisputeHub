# Application Name
spring.application.name=disputehub-portal

# Server Port
server.port=8080

# Database Configuration
# SECURITY: NO DEFAULTS - Must be configured per profile
# For local development: see application-dev.properties
# For production: define in application-prod.properties or set environment variables
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# EXPLANATION:
# - hibernate.ddl-auto=validate: Only validates schema matches entities (no auto-creation)
# - Flyway now manages all schema changes via versioned migration scripts
# - show-sql: Logs SQL queries (helpful for debugging, disable in production)
# - format_sql: Pretty-prints SQL queries
# - dialect: Tells Hibernate which SQL dialect to use (PostgreSQL-specific features)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
# EXPLANATION: Flyway manages database schema via versioned SQL migration files
# - baseline-on-migrate: Allows Flyway to work with existing databases
# - locations: Where migration scripts are stored
# - baseline-version: Starting version for existing databases
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

# Logging Configuration
# EXPLANATION: Set log levels (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO
logging.level.com.disputehub.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
# EXPLANATION:
# - secret-key: Must be defined in profile-specific properties (application-dev.properties, application-prod.properties)
#               OR set via JWT_SECRET environment variable in production
# - expiration: Token validity period in milliseconds (3600000 = 1 hour)
# SECURITY: No default - each profile must explicitly configure the JWT secret
jwt.expiration=3600000

# CORS Configuration
# SECURITY: NO DEFAULTS - Must be configured per profile
# For local development: see application-dev.properties
# For production: define in application-prod.properties or set CORS_ORIGINS environment variable

# Actuator Configuration
# EXPLANATION: Spring Boot Actuator provides production-ready monitoring endpoints
# - health: Shows application health (DB connectivity, disk space, etc.)
# - info: Application information
# - metrics: Performance metrics (requests, cache hit rate, JVM stats)
# - caches: Cache statistics (see Caffeine cache hit/miss rates)
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Graceful Shutdown
# EXPLANATION: Waits for active requests to complete before shutting down
# Critical for zero-downtime deployments
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# SpringDoc OpenAPI Configuration
# EXPLANATION: Auto-generates API documentation and Swagger UI
# - Swagger UI available at: http://localhost:8080/swagger-ui.html
# - OpenAPI JSON spec at: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
