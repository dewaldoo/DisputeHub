# Test Profile Configuration
# Used by @ActiveProfiles("test") in integration tests

# H2 In-Memory Database for Tests
# EXPLANATION: H2 is lightweight, PostgreSQL-compatible, perfect for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
# ddl-auto=create-drop: Creates schema at start, drops at end (clean state per test run)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Logging - Quieter for tests
logging.level.root=WARN
logging.level.com.disputehub.api=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# JWT Configuration for Tests
jwt.secret-key=TestSecretKeyForDisputeHubMinimum32CharactersLongHS256
jwt.expiration=3600000

# CORS Configuration for Tests
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator for Tests
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Disable Banner for Clean Test Output
spring.main.banner-mode=off

# Disable Flyway for Tests (using Hibernate ddl-auto instead)
spring.flyway.enabled=false
